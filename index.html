<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hour| Find your sunny spot</title>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <!-- <div id="sun"></div>
    <div class="sky-background"></div> -->
    
    <main>
        <canvas id="sun-canvas"></canvas>
        <section id="golden-site-wrapper">
            <h2 id="main-title">Golden Hour</h2>
            <p id="subtitle">Find your sunny spot</p>
            <div id="golden-site">
                <input id="location-finder" type="text" placeholder="Enter Your City or Postcode..."/>
                <input id="search-btn" type="button" value="Search" onclick= "findGoldenHour()"/>
            </div>
            <div id="location-options">
                <select id="radius-select">
                    <option value="10000">10 km</option>
                    <option value="20000">20 km</option>
                    <option value="50000">50 km</option>
                </select>
                <input id="geo-btn" type="button" value="Use My Location" onclick="getGeoLocation()"/>
            </div>
            <div id="sun-data" style="display:none";>
                <div class="hour-holder">
                    <div id="golden-hour"></div>
                 </br>
                    <div id="location-time"></div>
                </div>
                
                <div class="sun-rise-set">
                    <div id="sunrise-box" ></div>
                    <div id="sunset-box"></div>
                </div>
                <div id="nearby-sun-place"></div>
            </div>
        </section>
    </main>
    <script src = "script.js"></script>
</body>
</html>
