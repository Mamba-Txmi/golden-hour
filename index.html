<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hour| Find your sunny spot</title>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <main>
        <section id="golden-site-wrapper">
            <h2 id="main-title">Golden Hour</h2>
            <p id="subtitle">Find your sunny spot</p>
            <div id="golden-site">
                <input id="location-finder" type="text" placeholder="Enter Your Location..."/>
                <input id="search-btn" type="button" value="search" onclick= "findGoldenHour()"/>
            </div>
            <div id="location-options">
                <select id="radius-select">
                    <option value="5">5 km</option>
                    <option value="10">10 km</option>
                    <option value="20">20 km</option>
                </select>
                <input id="geo-btn" type="button" value="Use My Location" onclick="getGeoLocation()"/>
            </div>
            <div id="sun-data" style="display:none";>
                <div id="location-time"></div>
                <div class="sun-rise-set">
                    <div id="sunrise-box" ></div>
                    <div id="sunset-box"></div>
                </div>
                <div class="hour-holder">
                    <div id="golden-hour"></div>
                </div>
            </div>
        </section>
    </main>
    <script src = "script.js"></script>
</body>
</html>
